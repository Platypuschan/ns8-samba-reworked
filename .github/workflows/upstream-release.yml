name: Track upstream and release

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - .dockerignore
      - UPSTREAM_VERSION
      - CUSTOM_VERSION
      - overlay/**
      - ui-overlay/**
      - scripts/**
      - tests/**
      - .github/workflows/upstream-release.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ns8-samba-upstream-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_raw=$(gh api repos/NethServer/ns8-samba/releases/latest --jq .tag_name)
          latest_upstream=${latest_raw#v}
          current_upstream=$(tr -d '[:space:]' < UPSTREAM_VERSION)
          current_custom=$(tr -d '[:space:]' < CUSTOM_VERSION)

          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ ${latest_upstream} =~ ${version_pattern} ]]
          [[ ${current_upstream} =~ ${version_pattern} ]]
          [[ ${current_custom} =~ ${version_pattern} ]]

          upstream_changed=false
          target_custom=${current_custom}
          if [[ ${latest_upstream} != "${current_upstream}" ]]; then
            upstream_changed=true
            target_custom=$(python3 scripts/next-version.py "${current_custom}")
          fi

          release_exists=false
          if gh release view "v${target_custom}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_exists=true
          fi

          active=true
          if [[ ${upstream_changed} == false ]]; then
            if [[ ${release_exists} == true ]]; then
              released_sha=$(git rev-list -n 1 "v${current_custom}")
              if [[ $(./scripts/release-scope.sh "${released_sha}") == false ]]; then
                active=false
              else
                target_custom=$(python3 scripts/next-version.py "${current_custom}" --patch)
              fi
            elif git rev-parse --verify --quiet "refs/tags/v${current_custom}" >/dev/null; then
              echo "Tag v${current_custom} exists without a release. Reconcile its published image and release manually; refusing to overwrite the version tag." >&2
              exit 1
            fi
          fi

          if [[ ${active} == true ]] && git rev-parse --verify --quiet "refs/tags/v${target_custom}" >/dev/null; then
            echo "Tag v${target_custom} is already in use; refusing to overwrite its published image." >&2
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samba"
          {
            printf 'active=%s\n' "${active}"
            printf 'upstream_changed=%s\n' "${upstream_changed}"
            printf 'version_changed=%s\n' "$([[ ${target_custom} != "${current_custom}" ]] && echo true || echo false)"
            printf 'upstream=%s\n' "${latest_upstream}"
            printf 'custom=%s\n' "${target_custom}"
            printf 'image=%s\n' "${image}"
          } >> "${GITHUB_OUTPUT}"

          printf 'Upstream: %s; custom: %s; release required: %s\n' \
            "${latest_upstream}" "${target_custom}" "${active}"

      - name: Capture source revision
        if: steps.target.outputs.active == 'true'
        id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build and test candidate
        if: steps.target.outputs.active == 'true'
        run: |
          ./scripts/test-image.sh \
            "${{ steps.target.outputs.upstream }}" \
            ns8-samba-reworked:candidate \
            "${{ steps.target.outputs.custom }}" \
            "${{ steps.source.outputs.sha }}"

      - name: Generate SBOM for tested image
        if: steps.target.outputs.active == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ns8-samba-reworked:candidate
          format: spdx-json
          output-file: samba.spdx.json
          upload-release-assets: false

      - name: Verify candidate matches current main
        if: steps.target.outputs.active == 'true'
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ $(git rev-parse HEAD) == "${remote_sha}" ]] || {
            echo 'Main changed during the build; a newer run must build and test that source.' >&2
            exit 1
          }

      - name: Record tested versions
        if: >-
          steps.target.outputs.active == 'true' &&
          steps.target.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.target.outputs.upstream }}' > UPSTREAM_VERSION
          printf '%s\n' '${{ steps.target.outputs.custom }}' > CUSTOM_VERSION
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UPSTREAM_VERSION CUSTOM_VERSION
          git commit -m 'release: prepare Samba ${{ steps.target.outputs.custom }}'
          git push origin HEAD:main

      - name: Log in to GHCR
        if: steps.target.outputs.active == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested module image
        if: steps.target.outputs.active == 'true'
        id: publish
        run: |
          set -euo pipefail
          existing_tag=$(git ls-remote origin 'refs/tags/v${{ steps.target.outputs.custom }}')
          if [[ -n ${existing_tag} ]]; then
            echo 'Version tag appeared during the build; refusing to overwrite its published image.' >&2
            exit 1
          fi
          image='${{ steps.target.outputs.image }}'
          candidate_id=$(docker image inspect --format '{{.Id}}' ns8-samba-reworked:candidate)
          for tag in '${{ steps.target.outputs.custom }}' 'upstream-${{ steps.target.outputs.upstream }}' latest; do
            docker tag ns8-samba-reworked:candidate "${image}:${tag}"
            [[ $(docker image inspect --format '{{.Id}}' "${image}:${tag}") == "${candidate_id}" ]]
            push_output=$(docker push "${image}:${tag}")
            printf '%s\n' "${push_output}"
            if [[ ${tag} == '${{ steps.target.outputs.custom }}' ]]; then
              digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<< "${push_output}")
              [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]
              printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
            fi
          done

      - name: Attest tested image provenance
        if: steps.target.outputs.active == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.target.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest tested image SBOM
        if: steps.target.outputs.active == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.target.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: samba.spdx.json
          push-to-registry: true

      - name: Create GitHub release
        if: steps.target.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          tag='v${{ steps.target.outputs.custom }}'
          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            git tag -a "${tag}" -m "NS8 Samba reworked ${{ steps.target.outputs.custom }}"
            git push origin "${tag}"
          fi
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "NS8 Samba reworked ${{ steps.target.outputs.custom }}" \
              --notes "Tested cross-cluster AD DC join UI and replication notification overlay based on NethServer/ns8-samba ${{ steps.target.outputs.upstream }}. Image: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.custom }}"
          fi
